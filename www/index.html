function ensureToilet(p){ if(!p.locs.some(l=>l.name==='厕所')) p.locs.push(newToilet()); }
function migrate(d){
  d.v=d.v||5; d.packages=d.packages||[]; d.activeId=d.activeId||(d.packages[0]&&d.packages[0].id);
  d.ui=Object.assign({snap:10,view:'home',pkgTab:'days',dayId:null,planId:null,teamFilter:'all',hideHints:false,returnView:null},d.ui||{});
  d.packages.forEach(p=>{
    p.locs=p.locs||[]; p.plans=p.plans||[]; p.days=p.days||[]; p.teams=p.teams||[]; p.todos=p.todos||[];
    const cc=v=>v==='项目费'?'项目':v==='食物费'?'食物':v;
    p.locs.forEach(l=>{ l.rating=l.rating||'C'; l.dur=l.dur||60; l.cost=l.cost||0; l.costCat=cc(l.costCat)||'门票'; l.booking=l.booking||''; l.note=l.note||''; });
    ensureToilet(p);
    p.plans.forEach(pl=>{ pl.items=(pl.items||[]).map(i=>Object.assign({id:i.id||uid('i'),locId:i.locId,start:i.start||0,dur:i.dur||60},i)); });
    p.days.forEach(dy=>{ dy.arrs=dy.arrs||[]; dy.extras=(dy.extras||[]).map(e=>Object.assign({},e,{cat:cc(e.cat)})); dy.date=dy.date||''; });
  });
  return d;
}
let S;
try{ const raw=localStorage.getItem(KEY); S=raw?migrate(JSON.parse(raw)):seed(); }catch(e){ S=seed(); }
if(!S.packages.length){ S=seed(); }
if(!S.packages.find(p=>p.id===S.activeId)) S.activeId=S.packages[0].id;
let undoStack=[];
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function snapState(){ undoStack.push(JSON.stringify(S)); if(undoStack.length>25)undoStack.shift(); }
function doUndo(){ if(!undoStack.length) return; S=JSON.parse(undoStack.pop()); save(); render(); toast('已撤销'); }

const PK=()=>S.packages.find(p=>p.id===S.activeId)||S.packages[0];
const dayById=id=>PK().days.find(d=>d.id===id);
const planById=id=>PK().plans.find(p=>p.id===id);
const locById=id=>PK().locs.find(l=>l.id===id);
const teamById=id=>PK().teams.find(t=>t.id===id);
const locCost=l=>+l.cost||0;
const arrCost=a=>{ const l=locById(a.locId); return l?locCost(l):0; };
const dayPlanCost=d=>d.arrs.reduce((s,a)=>s+arrCost(a),0);
const dayExtraCost=d=>(d.extras||[]).reduce((s,e)=>s+(+e.amount||0),0);
const dayCost=d=>dayPlanCost(d)+dayExtraCost(d);
const planCost=p=>(p.items||[]).reduce((s,i)=>{ const l=locById(i.locId); return s+(l?locCost(l):0); },0);
const pkgActual=p=>p.days.reduce((s,d)=>s+dayCost(d),0);
const pkgPlan=p=>p.plans.reduce((s,pl)=>s+planCost(pl),0);
const pkgRange=p=>{
  const ds=p.days.map(d=>d.date).filter(Boolean).sort();
  return ds.length?(dShort(ds[0])+(ds.length>1?' ~ '+dShort(ds[ds.length-1]):'')):'';
};
function costRowsFor(p,cat){
  const locOf=id=>p.locs.find(l=>l.id===id);
  const rows=[];
  p.days.forEach(d=>{
    d.arrs.forEach(a=>{ const l=locOf(a.locId); if(l&&locCost(l)>0) rows.push({day:d,name:l.name,cat:l.costCat||'门票',amount:locCost(l),kind:'plan',rating:l.rating}); });
    (d.extras||[]).forEach(e=>rows.push({day:d,name:e.name,cat:e.cat||'额外花销',amount:+e.amount||0,kind:'extra'}));
  });
  return cat?rows.filter(r=>r.cat===cat):rows;
}
function costRows(cat){ return costRowsFor(PK(),cat); }
const totalCost=cat=>costRows(cat).reduce((s,r)=>s+r.amount,0);
function dayCatSegs(d){
  const m={};
  d.arrs.forEach(a=>{ const l=locById(a.locId); if(l&&locCost(l)>0){ const c=l.costCat||'门票'; m[c]=(m[c]||0)+locCost(l); } });
  (d.extras||[]).forEach(e=>{ const c=e.cat||'额外花销'; m[c]=(m[c]||0)+(+e.amount||0); });
  return COST_CATS.filter(c=>m[c]).map(c=>({cat:c,amt:m[c]}));
}

/* ==================== 通用 UI ==================== */
let toastTimer=null;
function toast(msg,undoLabel,cb){
  const t=$('#toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undoLabel?'<button id="toastBtn">'+esc(undoLabel)+'</button>':'');
  t.classList.add('on'); clearTimeout(toastTimer);
  if(undoLabel) $('#toastBtn').onclick=()=>{ t.classList.remove('on'); clearTimeout(toastTimer); cb&&cb(); };
  toastTimer=setTimeout(()=>t.classList.remove('on'),undoLabel?3600:1900);
}
function openSheet(html){ $('#sheet').innerHTML=html; $('#mask').classList.add('on'); $('#sheet').classList.add('on'); }
function closeSheet(){ $('#mask').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#mask').addEventListener('click',closeSheet);

function longPress(el,opt){
  const o=Object.assign({delay:260,onStart:null,onMove:null,onEnd:null,onCancel:null,tapLong:null,ignore:null},opt);
  let pid=null,timer=null,act=false,moved=false,sx=0,sy=0;
  function onDocTouch(e){ if(act) e.preventDefault(); }
  const activate=e=>{
    if(act) return;
    act=true;
    try{ navigator.vibrate&&navigator.vibrate(12); }catch(_){}
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    document.addEventListener('touchmove',onDocTouch,{passive:false});
    o.onStart&&o.onStart(e);
  };
  const down=e=>{
    if(pid!==null||(e.button&&e.button>0)) return;
    if(o.ignore&&o.ignore(e)) return;
    pid=e.pointerId; sx=e.clientX; sy=e.clientY; act=false; moved=false;
    const d=e.pointerType==='mouse'?110:o.delay;
    timer=setTimeout(()=>{ activate(e); },d);
  };
  const move=e=>{
    if(pid===null||e.pointerId!==pid) return;
    if(!act){
      const mx=Math.abs(e.clientX-sx), my=Math.abs(e.clientY-sy);
      if(e.pointerType==='mouse'&&(mx>4||my>4)){ clearTimeout(timer); moved=true; activate(e); return; } // 电脑：按下即可直接拖动
      if(mx>9||my>9){ clearTimeout(timer); pid=null; }
      return;
    }
    if(Math.abs(e.clientX-sx)>6||Math.abs(e.clientY-sy)>6) moved=true;
    e.preventDefault(); o.onMove&&o.onMove(e);
  };
  const up=e=>{
    if(pid===null||e.pointerId!==pid) return;
    clearTimeout(timer);
    document.removeEventListener('touchmove',onDocTouch);
    if(act){ o.onEnd&&o.onEnd(e,moved); if(!moved) o.tapLong&&o.tapLong(e); }
    else { o.onCancel&&o.onCancel(e); }
    act=false; pid=null; moved=false;
  };
  el.addEventListener('pointerdown',down);
  el.addEventListener('pointermove',move,{passive:false});
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
}
function directDrag(el,opt){
  const o=Object.assign({onStart:null,onMove:null,onEnd:null},opt);
  let pid=null,act=false;
  function onDocTouch(e){ if(act) e.preventDefault(); }
  const down=e=>{ if(pid!==null||(e.button&&e.button>0)) return; pid=e.pointerId; act=true;
    document.addEventListener('touchmove',onDocTouch,{passive:false});
    try{ el.setPointerCapture(pid); }catch(_){}
    o.onStart&&o.onStart(e); };
  const move=e=>{ if(pid===null||e.pointerId!==pid) return; e.preventDefault(); o.onMove&&o.onMove(e); };
  const up=e=>{ if(pid===null||e.pointerId!==pid) return; act=false; document.removeEventListener('touchmove',onDocTouch); o.onEnd&&o.onEnd(e); pid=null; };
  el.addEventListener('pointerdown',down);
  el.addEventListener('pointermove',move,{passive:false});
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
}
function setChipDrop(chip){ $$('.dchip').forEach(c=>c.classList.toggle('drop',chip&&c===chip)); }

function bindCard(el,box,opt){
  const o=Object.assign({commit:null,menu:null,hoverChips:null,onDropChip:null,onDelete:null},opt);
  let startY=0,ph=null,drag=null,delHot=false,fromT1=false;
  const delxShow=()=>{ let x=$('#delx'); if(!x){ x=document.createElement('div'); x.id='delx'; x.className='delx'; x.textContent='✕'; document.body.appendChild(x); } x.classList.add('on'); };
  const delxHide=()=>{ const x=$('#delx'); if(x) x.classList.remove('on','hot'); delHot=false; };
  const delxHit=e=>{ const x=$('#delx'); if(!x) return; const r=x.getBoundingClientRect();
    delHot=e.clientX>r.left-24&&e.clientX<r.right+24&&e.clientY>r.top-24&&e.clientY<r.bottom+24;
    x.classList.toggle('hot',delHot); };
  const cleanup=()=>{ if(ph){ph.remove();ph=null;} if(drag){drag.classList.remove('drag');drag.style.transform='';drag.style.transition='';} setChipDrop(null); drag=null; };
  longPress(el,{
    onStart:e=>{ fromT1=!!(e.target&&e.target.closest&&e.target.closest('.t1')); drag=el; startY=e.clientY; el.classList.add('drag'); el.style.transition='none';
      ph=document.createElement('div'); ph.className='ph'; ph.textContent=o.hoverChips?'拖动调整顺序 / 拖到下方行程卡…':'拖动调整顺序 · 拖到底部 ✕ 删除';
      el.parentNode.insertBefore(ph,el.nextSibling);
      if(o.onDelete) delxShow(); },
    onMove:e=>{
      if(!drag) return;
      if(o.onDelete) delxHit(e);
      drag.style.transform='translateY('+(e.clientY-startY)+'px)';
      const order=$$('.pkcard',box), cur=order.indexOf(drag);
      const rc=drag.getBoundingClientRect(), mid=rc.top+rc.height/2;
      for(let i=0;i<order.length;i++){
        if(order[i]===drag) continue;
        const b=order[i].getBoundingClientRect(), bm=b.top+b.height/2;
        if(i<cur&&mid<bm){ ph.parentNode.insertBefore(ph,order[i]); break; }
        if(i>cur&&mid>bm){ ph.parentNode.insertBefore(ph,order[i].nextSibling); break; }
      }
      drag.dataset.chip='';
      const chips=typeof o.hoverChips==='function'?o.hoverChips():(o.hoverChips||[]);
      if(chips.length){
        let hit=null;
        chips.forEach(c=>{ const r=c.getBoundingClientRect();
          if(e.clientY>r.top-10&&e.clientY<r.bottom+10&&e.clientX>r.left-16) hit=c; });
        setChipDrop(hit);
        if(hit) drag.dataset.chip=hit.dataset.drop||'';
      }
    },
    onEnd:(e,moved)=>{
      if(!drag) return;
      const chip=drag.dataset.chip||'';
      // 插入位 = 占位块之前的卡片数（不含被拖卡片）
      let ins=0;
      for(const n of Array.prototype.slice.call(box.children)){
        if(n===ph) break;
        if(n===drag) continue;
        if(n.classList.contains('pkcard')) ins++;
      }
      if(moved){ el.dataset.noClick='1'; setTimeout(()=>{ delete el.dataset.noClick; },400); }
      cleanup();
      const wasDel=delHot; delxHide();
      if(moved&&wasDel&&o.onDelete){ o.onDelete(); return; }
      if(moved&&chip&&o.onDropChip){ o.onDropChip(chip); return; }
      if(moved&&o.commit){ o.commit(ins); }
    },
    onCancel:()=>{ cleanup(); delxHide(); },
    tapLong:()=>{ if(o.menu && !fromT1) o.menu(); }
  });
}

function blkHtml(a,HH,o){
  const l=locById(a.locId); if(!l) return '';
  const c=l.color||'#7b8496', y=a.start/60*HH, h=Math.max(a.dur/60*HH-2,16);
  const rt=RATING[l.rating]||RATING.C;
  const tm=teamById(a.teamId);
  const tag=(tm&&(o.teamFilter==='all'))?'<span class="teamtag">'+esc(tm.name)+'</span>':'';
  const tail=o.noteInBlk?(l.note?' · '+esc(l.note):(locCost(l)>0?' · '+money(locCost(l)):'')):(locCost(l)>0?' · '+money(locCost(l)):'');
  const t2=(h>=36)?'<div class="t2">'+fmtHM(a.start)+' ~ '+fmtHM(a.start+a.dur)+tail+'</div>':'';
  return '<div class="blk" data-arr="'+a.id+'" style="top:'+y+'px;height:'+h+'px;background:'+tint(c,'26')+';border-left-color:'+c+'">'
    +(o.interactive?'<div class="grip"></div><div class="rz"></div>':'')
    +'<div class="in"><div class="t1" style="color:'+c+'">'
      +'<span class="rt" style="background:'+rt.c+'">'+esc(l.rating||'C')+'</span>'
      +'<span class="ttl">'+esc(l.name)+'</span>'+tag+'</div>'+t2+'</div></div>';
}
function tlMarkup(arrs,extras,HH,opt){
  const o=Object.assign({interactive:false,showHalf:true,teamFilter:'all',costCol:true,lanes:null},opt);
  const H=24*HH;
  let rail='',grid='';
  for(let t=0;t<=24*60;t+=60){
    const y=t/60*HH;
    grid+='<div class="hline" style="top:'+y+'px"></div>';
    rail+='<div class="hr" style="top:'+y+'px">'+(t/60)+':00</div>';
    if(o.showHalf&&t<24*60) grid+='<div class="hline half" style="top:'+(y+HH/2)+'px"></div>';
  }
  let inner='';
  if(o.lanes&&o.lanes.length>1){
    const n=o.lanes.length;
    inner='<div class="lanes'+(o.compact?' compact':'')+'">';
    o.lanes.forEach((ln,i)=>{
      inner+='<div class="lane" style="left:'+(i*100/n)+'%;width:'+(100/n)+'%"><div class="lanehd">'+esc(ln.title)+'</div>';
      (ln.arrs||[]).forEach(a=>{ inner+=blkHtml(a,HH,Object.assign({},o,{teamFilter:'all'})); });
      inner+='</div>';
    });
    inner+='</div>';
  } else {
    (arrs||[]).filter(a=>o.teamFilter==='all'||!a.teamId||a.teamId===o.teamFilter)
      .forEach(a=>{ inner+=blkHtml(a,HH,o); });
  }
  let exl='';
  (extras||[]).forEach(e=>{
    const y=(e.at||9*60)/60*HH, w=clamp(2+Math.sqrt(+e.amount||0)/3,2,6);
    exl+='<div class="expl" data-ex="'+e.id+'" style="top:'+y+'px"><div class="ln" style="border-top-width:'+w.toFixed(1)+'px"></div>'
      +(o.interactive?'<div class="eh" data-e="'+e.id+'">'+esc(e.name)+' '+money(e.amount)+'</div>':'')
    +'</div>';
  });
  let cost='';
  if(o.costCol){
    const list=(arrs||[]).filter(a=>o.teamFilter==='all'||!a.teamId||a.teamId===o.teamFilter);
    list.forEach(a=>{
      const l=locById(a.locId); if(!l||!(locCost(l)>0)) return;
      cost+='<div class="ce" style="top:'+(a.start/60*HH)+'px">'+money(l.cost)+'</div>';
    });
    (extras||[]).forEach(e=>{
      cost+='<div class="ct" style="top:'+((e.at||9*60)/60*HH)+'px">额外 '+money(e.amount)+'</div>';
    });
  }
  return '<div class="tgrid" style="height:'+H+'px">'
    +'<div class="rail">'+rail+'</div>'
    +'<div class="col">'+grid+inner+exl+'</div>'
    +(o.costCol?'<div class="costcol">'+cost+'</div>':'')
    +'</div>';
}

    +'</div>'; }).join('');

/* ==================== 行程卡编辑 ==================== */
const HH_EDIT=56;
function teamModes(p){
  if(!p.teams.length) return [['all','全体']];
  return [['all','全体'],['par','并联']].concat(p.teams.map(t=>[t.id,t.name]));
}
function renderDay(){
  const p=PK(), d=dayById(S.ui.dayId);
  if(!d){ S.ui.view='pkg'; render(); return; }
  const rng=d.date?dShort(d.date):'';
  $('#dayName').textContent=p.name+' · '+d.name+(rng?' · '+rng:'');
  $$('#snapSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.ui.snap));
  const hasTeams=p.teams.length>0;
  $('#teamTool').style.display=hasTeams?'':'none';
  if(hasTeams){
    $('#teamSeg').innerHTML=teamModes(p).map(m=>'<button data-v="'+m[0]+'"'+(S.ui.teamFilter===m[0]?' class="on"':'')+'>'+m[1]+'</button>').join('')
      +'<button data-v="__new">＋团队</button>';
    $$('#teamSeg button').forEach(b=>b.onclick=()=>{
      if(b.dataset.v==='__new'){ addTeam(); return; }
      S.ui.teamFilter=b.dataset.v; save(); renderDay(); });
  }
  const lanes=(hasTeams&&S.ui.teamFilter==='par')?[ {title:'全体',arrs:d.arrs.filter(a=>!a.teamId)} ].concat(p.teams.map(t=>({title:t.name,arrs:d.arrs.filter(a=>a.teamId===t.id)}))):null;
  $('#dayBody').innerHTML=tlMarkup(d.arrs,d.extras,HH_EDIT,{
      interactive:true,noteInBlk:true,teamFilter:lanes?'all':S.ui.teamFilter,lanes:lanes})
    +'<div style="height:26px"></div>'
    +'<div class="hint">长按安排块拖动改时间 · 拖底部横条改时长 · 点安排块编辑 / 换团队 / 移除 · 红线标签可拖动调整花销时间</div>';
  bindDayTimeline(d);
  const first=d.arrs.length?Math.min.apply(null,d.arrs.map(a=>a.start)):8*60;
  $('#dayScroll').scrollTop=clamp(first/60*HH_EDIT-130,0,1e6);
  renderLocBar(d);
}
function addTeam(){
  const v=prompt('团队名称','团队'+(PK().teams.length+1)); if(v===null) return;
  snapState(); const t={id:uid('tm'),name:v.trim()||'团队'};
  PK().teams.push(t); S.ui.teamFilter=t.id;
  save(); render(); toast('已创建 '+t.name,'撤销',doUndo);
}
function renderLocBar(d){
  const p=PK();
  $('#locBar').innerHTML='<button class="dchip" data-add="__tap">⇊ 末尾添加：点地点卡</button>'
    +p.locs.map(l=>{ const rt=RATING[l.rating]||RATING.C;
      return '<button class="dchip" data-loc="'+l.id+'"><span class="rt" style="background:'+rt.c+'">'+esc(l.rating||'C')+'</span> '+esc(l.name)
        +(locCost(l)>0?'<span class="n">'+money(l.cost)+'</span>':'')+'</button>'; }).join('');
  $$('#locBar [data-loc]').forEach(c=>{
    const l=locById(c.dataset.loc); if(!l) return;
    c.onclick=()=>{ if(c.dataset.noClick) return; appendArr(d,l); };
    bindLocDrag(c,l,d);

function appendArr(d,l,start){
  const pxPerMin=HH_EDIT/60;
  snapState();
  let st=start;
  if(st==null){ let last=0; d.arrs.forEach(a=>{ last=Math.max(last,a.start+a.dur); }); st=clamp(Math.ceil(last/S.ui.snap)*S.ui.snap,0,1440-(l.dur||60)); }
  const a={id:uid('a'),locId:l.id,start:clamp(st,0,1440-(l.dur||60)),dur:l.dur||60,teamId:null};
  d.arrs.push(a); save(); renderDay();
  toast('已加入「'+l.name+'」 '+fmtHM(a.start),'撤销',doUndo);
}
function laneAtX(col,x){
  const lanes=$$('.lane',col);
  if(!lanes.length) return null;
  const r=col.getBoundingClientRect();
  for(let i=0;i<lanes.length;i++){
    const lr=lanes[i].getBoundingClientRect();
    if(x>=lr.left&&x<=lr.right) return i;
  }
  return null;
}
function edgeScroll(scrollEl,e){
  if(!scrollEl) return;
  const r=scrollEl.getBoundingClientRect(), M=64, sp=13;
  if(e.clientY<r.top+M) scrollEl.scrollTop-=sp*(1-(e.clientY-r.top)/M);
  else if(e.clientY>r.bottom-M) scrollEl.scrollTop+=sp*(1-(r.bottom-e.clientY)/M);
}
function bindLocDrag(chip,loc,d){
  let ghost=null,offY=0;
  longPress(chip,{
    onStart:e=>{ snapState();
      const rc=chip.getBoundingClientRect(); offY=e.clientY-rc.top;
      ghost=chip.cloneNode(true); ghost.classList.add('ghost');
      ghost.style.cssText+=';left:'+(rc.left)+'px;top:'+rc.top+'px;width:'+rc.width+'px;';
      document.body.appendChild(ghost);
      toast('拖到时间轴上松手，即在该时间添加'); },
    onMove:e=>{ if(ghost) ghost.style.top=(e.clientY-offY)+'px'; edgeScroll($('#dayScroll'),e); },
    onEnd:e=>{
      if(ghost){ ghost.remove(); ghost=null; }
      const el=document.elementFromPoint(e.clientX,e.clientY);
      const col=el&&el.closest?el.closest('.col'):null;
      if(col){
        const rc=col.getBoundingClientRect();
        const st=clamp(Math.round(((e.clientY-rc.top)/(HH_EDIT/60))/S.ui.snap)*S.ui.snap,0,1435);
        const li=laneAtX(col,e.clientX);
        const lanes=$$('.lane',col);
        let teamId=null;
        if(lanes.length&&li!=null&&li>0){ const hd=$$('.lane',col)[li].querySelector('.lanehd'); const nm=hd?hd.textContent:''; const tm=PK().teams.find(t=>t.name===nm); teamId=tm?tm.id:null; }
        const a={id:uid('a'),locId:loc.id,start:st,dur:loc.dur||60,teamId:teamId};
        d.arrs.push(a); save(); renderDay();
        toast('已加入「'+loc.name+'」 '+fmtHM(st)+(teamId?' · '+teamById(teamId).name:''),'撤销',doUndo);
      } else { undoStack.pop(); toast('已取消'); }
    }
  });
}
function bindDayTimeline(d){
  const col=$('#dayBody .col'); if(!col) return;
  const pxPerMin=HH_EDIT/60;
  const redrawCosts=()=>{
    const cc=$('#dayBody .costcol'); if(!cc) return;
    const entries=[];
    d.arrs.filter(a=>S.ui.teamFilter!=='par'||true).forEach(a=>{
      const l=locById(a.locId); if(l&&locCost(l)>0) entries.push({y:a.start*pxPerMin,txt:money(l.cost),cls:'ce'}); });
    (d.extras||[]).forEach(e=>entries.push({y:(e.at||9*60)*pxPerMin,txt:'额外 '+money(e.amount),cls:'ct'}));
    cc.innerHTML=entries.map(x=>'<div class="'+x.cls+'" style="top:'+x.y+'px">'+esc(x.txt)+'</div>').join('');
  };
  $$('.blk',col).forEach(blk=>{
    const a=d.arrs.find(x=>x.id===blk.dataset.arr); if(!a) return;
    let startY=0,startVal=0,moved=false,snapped=false,justTapped=false;
    const applyStart=ns=>{
      ns=clamp(Math.round(ns/S.ui.snap)*S.ui.snap,0,1440-a.dur);
      a.start=ns; blk.style.top=(ns*pxPerMin)+'px'; moved=true; redrawCosts();
    };
    const applyDur=nd=>{
      nd=clamp(Math.round(nd/S.ui.snap)*S.ui.snap,S.ui.snap,1440-a.start);
      a.dur=nd; blk.style.height=Math.max(nd*pxPerMin-2,16)+'px'; moved=true; redrawCosts();
    };
    const startCommon=e=>{ snapState(); snapped=true; startY=e.clientY; startVal=a.start; moved=false; justTapped=false; blk.classList.add('drag'); };
    longPress(blk,{ignore:e=>{ const t=e.target; return !!(t&&t.closest&&t.closest('.rz,.grip,.eh,.t1')); },
      onStart:startCommon,
      onMove:e=>applyStart(startVal+(e.clientY-startY)/pxPerMin),
      onEnd:(e,mv)=>{ blk.classList.remove('drag');
        if(mv&&moved){ save(); renderDay(); toast('已调整到 '+fmtHM(a.start),'撤销',doUndo); }
        else if(snapped&&!moved) undoStack.pop(); },
      onCancel:()=>{ if(snapped&&!moved) undoStack.pop(); },
      tapLong:()=>{ justTapped=true; openArr(a,d); } });
    const dragMove=el=>directDrag(el,{onStart:startCommon,
      onMove:e=>applyStart(startVal+(e.clientY-startY)/pxPerMin),
      onEnd:()=>{ blk.classList.remove('drag'); if(moved){ save(); renderDay(); toast('已调整到 '+fmtHM(a.start),'撤销',doUndo); } else undoStack.pop(); }});
    const grip=$('.grip',blk);
    if(grip) dragMove(grip);
    const t1=$('.t1',blk);
    if(t1) dragMove(t1);
    const rz=$('.rz',blk);
    if(rz) directDrag(rz,{onStart:e=>{ snapState(); snapped=true; startY=e.clientY; startVal=a.dur; moved=false; blk.classList.add('drag'); },
      onMove:e=>applyDur(startVal+(e.clientY-startY)/pxPerMin),
      onEnd:()=>{ blk.classList.remove('drag'); if(moved){ save(); renderDay(); toast('时长 '+durLabel(a.dur),'撤销',doUndo); } else undoStack.pop(); }});
    blk.addEventListener('click',()=>{ if(moved||justTapped) return; openArr(a,d); });
  });
  // 红色花销线：拖动标签调整时间点
  $$('.expl',col).forEach(ex=>{
    const e=d.extras.find(x=>x.id===ex.dataset.ex); if(!e) return;
    const h=$('.eh',ex); if(!h) return;
    let startY=0,at0=0,moved=false;
    directDrag(h,{
      onStart:ev=>{ snapState(); startY=ev.clientY; at0=e.at; moved=false; },
      onMove:ev=>{
        const na=clamp(Math.round((at0+(ev.clientY-startY)/pxPerMin)/S.ui.snap)*S.ui.snap,0,1435);
        e.at=na; moved=true;
        ex.style.top=(na*pxPerMin)+'px';
        h.textContent=e.name+' '+money(e.amount);
      },
      onEnd:()=>{ if(moved){ save(); renderDay(); toast('花销时间已调到 '+fmtHM(e.at),'撤销',doUndo); } else undoStack.pop(); }
    });
    h.addEventListener('click',()=>{ if(moved) return; extraList(d); });
  });
}

const HH_PLAN=56;
function renderPlan(){

      interactive:true,costCol:false})
    +'<div class="hint" style="padding-top:14px">计划费用 '+money(cost)+' · 长按块拖动改时间 / 拖底部改时长 / 点块编辑或移除</div>'
    +'<div style="height:20px"></div>';
  // 右侧地点卡栏
  const col=$('#planBody .col');
  const pal=document.createElement('div');
  pal.className='palette';
  pal.innerHTML='<div class="pin"><div class="pttl">地点卡 · 点按或拖入</div>'
    +p.locs.map(l=>{ const rt=RATING[l.rating]||RATING.C;
      return '<div class="pchip" data-loc="'+l.id+'"><span class="dot" style="background:'+l.color+'"></span><span class="nm">'+esc(l.name)+'</span><span class="rt" style="background:'+rt.c+'">'+esc(l.rating||'C')+'</span></div>'; }).join('')
    +'</div>';
  $('#planBody .tgrid').appendChild(pal);
  bindPlanTimeline(pl);
  bindPalette(pal,pl);
  const first=(pl.items||[]).length?Math.min.apply(null,pl.items.map(i=>i.start)):8*60;
  $('#planScroll').scrollTop=clamp(first/60*HH_PLAN-130,0,1e6);
}
function bindPlanTimeline(pl){
  const col=$('#planBody .col'); if(!col) return;
  const pxPerMin=HH_PLAN/60;
  $$('.blk',col).forEach(blk=>{
    const it=(pl.items||[]).find(x=>x.id===blk.dataset.arr); if(!it) return;
    let startY=0,startVal=0,moved=false,snapped=false,justTapped=false;
    const applyStart=ns=>{
      ns=clamp(Math.round(ns/S.ui.snap)*S.ui.snap,0,1440-it.dur);
      it.start=ns; blk.style.top=(ns*pxPerMin)+'px'; moved=true;
    };
    const applyDur=nd=>{
      nd=clamp(Math.round(nd/S.ui.snap)*S.ui.snap,S.ui.snap,1440-it.start);
      it.dur=nd; blk.style.height=Math.max(nd*pxPerMin-2,16)+'px'; moved=true;
    };
    const startCommon=e=>{ snapState(); snapped=true; startY=e.clientY; startVal=it.start; moved=false; justTapped=false; blk.classList.add('drag'); };
    longPress(blk,{ignore:e=>{ const t=e.target; return !!(t&&t.closest&&t.closest('.rz,.grip,.eh,.t1')); },
      onStart:startCommon,
      onMove:e=>applyStart(startVal+(e.clientY-startY)/pxPerMin),
      onEnd:(e,mv)=>{ blk.classList.remove('drag');
        if(mv&&moved){ save(); renderPlan(); toast('已调整到 '+fmtHM(it.start),'撤销',doUndo); }
        else if(snapped&&!moved) undoStack.pop(); },
      onCancel:()=>{ if(snapped&&!moved) undoStack.pop(); },
      tapLong:()=>{ justTapped=true; openPlanItem(pl,it); } });
    const dragMove=el=>directDrag(el,{onStart:startCommon,onMove:e=>applyStart(startVal+(e.clientY-startY)/pxPerMin),
      onEnd:()=>{ blk.classList.remove('drag'); if(moved){ save(); renderPlan(); toast('已调整到 '+fmtHM(it.start),'撤销',doUndo); } else undoStack.pop(); }});
    const grip=$('.grip',blk);
    if(grip) dragMove(grip);
    const t1=$('.t1',blk);
    if(t1) dragMove(t1);
    const rz=$('.rz',blk);
    if(rz) directDrag(rz,{onStart:e=>{ snapState(); snapped=true; startY=e.clientY; startVal=it.dur; moved=false; blk.classList.add('drag'); },
      onMove:e=>applyDur(startVal+(e.clientY-startY)/pxPerMin),
      onEnd:()=>{ blk.classList.remove('drag'); if(moved){ save(); renderPlan(); toast('时长 '+durLabel(it.dur),'撤销',doUndo); } else undoStack.pop(); }});
    blk.addEventListener('click',()=>{ if(moved||justTapped) return; openPlanItem(pl,it); });
  });
}
function openPlanItem(pl,it){
  const l=locById(it.locId); if(!l) return;
  openSheet('<h3>'+esc(l.name)+'<span class="spacer"></span><span class="tiny" style="background:var(--plan);border-color:var(--plan-b)">计划项</span></h3>'

    save(); closeSheet(); renderPlan(); toast('已保存','撤销',doUndo);

  $('#piDel').onclick=()=>{ snapState(); pl.items=pl.items.filter(x=>x.id!==it.id); save(); closeSheet(); renderPlan(); toast('已移除','撤销',doUndo); };
  $('#piCancel').onclick=closeSheet;

function bindPalette(pal,pl){
  const p=PK();
  $$('.pchip',pal).forEach(ch=>{
    const l=locById(ch.dataset.loc); if(!l) return;
    ch.onclick=()=>{ if(ch.dataset.noClick) return;
      snapState();
      let last=0; (pl.items||[]).forEach(i=>{ last=Math.max(last,i.start+i.dur); });
      pl.items=pl.items||[];
      pl.items.push({id:uid('i'),locId:l.id,start:clamp(Math.ceil(last/S.ui.snap)*S.ui.snap,0,1435),dur:l.dur||60});
      save(); renderPlan(); toast('已加入「'+l.name+'」','撤销',doUndo); };
    let ghost=null,offY=0;
    longPress(ch,{
      onStart:e=>{ snapState();
        const rc=ch.getBoundingClientRect(); offY=e.clientY-rc.top;
        ghost=ch.cloneNode(true); ghost.classList.add('ghost');
        ghost.style.cssText+=';left:'+rc.left+'px;top:'+rc.top+'px;width:'+rc.width+'px;';
        document.body.appendChild(ghost);
        toast('拖到时间轴上松手，即在该时间安排'); },
      onMove:e=>{ if(ghost) ghost.style.top=(e.clientY-offY)+'px'; edgeScroll($('#planScroll'),e); },
      onEnd:e=>{
        if(ghost){ ghost.remove(); ghost=null; }
        const el=document.elementFromPoint(e.clientX,e.clientY);
        const col=el&&el.closest?el.closest('#planBody .col'):null;
        if(col){
          const rc=col.getBoundingClientRect();
          const st=clamp(Math.round(((e.clientY-rc.top)/(HH_PLAN/60))/S.ui.snap)*S.ui.snap,0,1435);
          pl.items=pl.items||[];
          pl.items.push({id:uid('i'),locId:l.id,start:st,dur:l.dur||60});
          save(); renderPlan(); toast('已在 '+fmtHM(st)+' 安排「'+l.name+'」','撤销',doUndo);
        } else { undoStack.pop(); toast('已取消'); }
      }
    });
  });
}

function renderCost(){
  const ps=S.packages, cats=COST_CATS;
  const pkgTotal=p=>costRowsFor(p).reduce((s,r)=>s+r.amount,0);
  const cellAmt=(p,c)=>costRowsFor(p,c).reduce((s,r)=>s+r.amount,0);
  const grand=c=>ps.reduce((s,p)=>s+cellAmt(p,c),0);
  const grandAll=ps.reduce((s,p)=>s+pkgTotal(p),0);
  const segSpan=pct=>pct>=8?'<span>'+Math.round(pct)+'%</span>':'';
  const usedCats=cats.filter(c=>grand(c)>0);
  const leg=usedCats.length?'<div class="pleg" style="margin:0 2px 10px">'+usedCats.map(c=>'<span class="li"><span class="sw" style="background:'+(COST_COLORS[c]||'#888')+'"></span>'+c+'</span>').join('')+'</div>':'';
  const barHtml=(pk,amts,tot)=>'<div class="pbar">'+(tot>0?cats.filter(c=>amts[c]>0).map(c=>{ const pct=amts[c]/tot*100; return '<div class="pseg" data-pk="'+pk+'" data-c="'+c+'" style="width:'+pct+'%;background:'+(COST_COLORS[c]||'#888')+'">'+segSpan(pct)+'</div>'; }).join(''):'<span class="cempty">暂无花销</span>')+'</div>';
  const row=(pk,name,amts,tot,total)=>'<div class="crow'+(total?' ctotal':'')+'" data-pk="'+pk+'">'
    +'<div class="cn">'+name+'</div>'
    +barHtml(pk,amts,tot)
    +'<span class="tiny money cv">'+money(tot)+'</span>'
    +'</div>';
  const sorted=ps.slice().sort((a,b)=>pkgTotal(b)-pkgTotal(a));
  const rows=sorted.map(p=>{ const amts={}; cats.forEach(c=>amts[c]=cellAmt(p,c)); return row(p.id,esc(p.name),amts,pkgTotal(p)); }).join('');
  const gamts={}; cats.forEach(c=>gamts[c]=grand(c));
  const totalRow=row('','全部合计',gamts,grandAll,true);
  $('#costBody').innerHTML='<div class="hint">行程包按实际花费从高到低排列；点条形看分类明细、点行看全部明细。</div>'
    +leg+'<div class="clist">'+rows+'</div><div class="clist total">'+totalRow+'</div>';
  $$('#costBody .crow[data-pk]').forEach(rw=>{
    const p=S.packages.find(x=>x.id===rw.dataset.pk); if(!p) return;
    rw.onclick=()=>costCellSheet(p,'__all',{open:true});
  });
  $$('#costBody .pseg[data-pk]').forEach(seg=>{
    const p=S.packages.find(x=>x.id===seg.dataset.pk); if(!p) return;
    seg.onclick=ev=>{ ev.stopPropagation(); costCellSheet(p,seg.dataset.c,{open:true}); };
  });
}
function costCellSheet(p,cat,opt){
  opt=opt||{};
  const rows=cat==='__all'?costRowsFor(p):costRowsFor(p,cat);
  const tot=rows.reduce((s,r)=>s+r.amount,0);
  openSheet('<h3>'+(cat==='__all'?'全部类型':esc(cat))+'<span class="spacer"></span><span class="tiny">'+esc(p.name)+'</span></h3>'
    +(rows.length?rows.map(r=>'<div class="sumrow"><span class="n">'+(r.rating?'<span class="rt" style="background:'+(RATING[r.rating]||RATING.C).c+'">'+r.rating+'</span> ':'')+esc(r.name)+' <span class="tiny">'+esc(r.day.name)+'</span></span><span class="v">'+money(r.amount)+'</span></div>').join(''):'<div class="hint">暂无花销</div>')
    +'<div class="sumrow"><span class="n"><b>小计</b></span><span class="v">'+money(tot)+'</span></div>'
    +(opt.open?'<button class="btn gh full" id="csOpen">打开行程包</button>':''));
  const ob=$('#csOpen');
  if(ob) ob.onclick=()=>{ S.activeId=p.id; S.ui.view='pkg'; S.ui.pkgTab='days'; save(); closeSheet(); render(); };
}
$('#costBack').onclick=()=>{ S.ui.view='home'; save(); render(); };

/* ==================== 长截图（整包行程卡导出长图） ==================== */
function rrPath(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function shotLong(){
  const p=PK();
  const cv=document.createElement('canvas');
  const ctx=cv.getContext&&cv.getContext('2d');
  if(!ctx||!ctx.measureText){ toast('当前环境不支持生成图片'); return; }
  const W=720,PAD=24,ROWH=21,CPADX=16,CPADY=13,HEADH=86,GAP=14,FOOT=46;
  const F=(w,s)=>w+' '+s+'px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  const cards=p.days.map(d=>{
    const rows=[];
    d.arrs.slice().sort((a,b)=>a.start-b.start).forEach(a=>{
      const l=p.locs.find(x=>x.id===a.locId); if(!l) return;
      rows.push({t:fmtHM(a.start)+'~'+fmtHM(a.start+a.dur),n:l.name,c:l.color||'#8a94a6',r:l.rating||'C',cost:locCost(l),extra:false});
    });
    (d.extras||[]).slice().sort((a,b)=>(a.at||0)-(b.at||0)).forEach(e=>{
      rows.push({t:fmtHM(e.at||0),n:e.name,c:'#d97706',r:'',cost:+e.amount||0,extra:true});
    });
    return {d:d,rows:rows,cost:dayCost(d)};
  });
  let H=HEADH;
  cards.forEach(c=>{ H+=CPADY*2+32+(c.rows.length?c.rows.length*ROWH:22)+GAP; });
  H+=FOOT;
  cv.width=W*2; cv.height=Math.round(H*2);
  ctx.scale(2,2);
  ctx.textBaseline='alphabetic';
  const clipText=(s,maxW)=>{ s=String(s); if(ctx.measureText(s).width<=maxW) return s; while(s.length&&ctx.measureText(s+'…').width>maxW) s=s.slice(0,-1); return s+'…'; };
  // 背景 + 顶部
  ctx.fillStyle='#eef1f7'; ctx.fillRect(0,0,W,H);
  const now=new Date();
  const rng=pkgRange(p);
  ctx.fillStyle='#161a22'; ctx.font=F('700',21);
  ctx.fillText(clipText(p.name,W-PAD*2-120),PAD,PAD+22);
  ctx.textAlign='right'; ctx.fillStyle='#e5484d'; ctx.font=F('700',18);
  ctx.fillText(money(pkgActual(p)),W-PAD,PAD+22);
  ctx.textAlign='left'; ctx.fillStyle='#7b8496'; ctx.font=F('400',12);
  ctx.fillText((rng?rng+' · ':'')+p.days.length+' 张行程卡 · 实际统计 · 生成于 '+dateStr(now)+' '+pad2(now.getHours())+':'+pad2(now.getMinutes()),PAD,PAD+46);
  // 各行程卡
  let y=HEADH;
  cards.forEach(c=>{
    const rowsH=c.rows.length?c.rows.length*ROWH:22;
    const ch=CPADY*2+32+rowsH;
    rrPath(ctx,PAD,y,W-PAD*2,ch,14); ctx.fillStyle='#ffffff'; ctx.fill();
    ctx.save(); rrPath(ctx,PAD,y,W-PAD*2,ch,14); ctx.clip();
    ctx.fillStyle='#a9cc93'; ctx.fillRect(PAD,y,5,ch); ctx.restore();
    const ix=PAD+CPADX+6, rx=W-PAD-CPADX+6;
    let iy=y+CPADY+20;
    ctx.fillStyle='#161a22'; ctx.font=F('700',15);
    ctx.fillText(clipText(c.d.name+(c.d.date?'　'+c.d.date:''),rx-ix-90),ix,iy);
    ctx.textAlign='right'; ctx.fillStyle='#e5484d'; ctx.font=F('700',14);
    ctx.fillText(money(c.cost),rx,iy); ctx.textAlign='left';
    iy+=10;
    if(!c.rows.length){ ctx.fillStyle='#9aa4b2'; ctx.font=F('400',12); ctx.fillText('暂无安排',ix,iy+14); }
    else c.rows.forEach(r=>{
      iy+=ROWH;
      ctx.beginPath(); ctx.arc(ix+4,iy-5,4,0,Math.PI*2); ctx.fillStyle=r.c; ctx.fill();
      ctx.fillStyle='#7b8496'; ctx.font=F('400',11);
      ctx.fillText(r.t,ix+16,iy);
      const nx=ix+16+82;
      const maxNm=rx-70-nx-(r.r&&!r.extra?26:0);
      ctx.fillStyle=r.extra?'#d97706':'#161a22'; ctx.font=F(r.extra?'600':'400',12.5);
      const nm=clipText((r.extra?'额外 · ':'')+r.n,Math.max(maxNm,40));
      ctx.fillText(nm,nx,iy);
      if(r.r&&!r.extra&&maxNm>=60){
        const bw=ctx.measureText(nm).width;
        ctx.fillStyle=(RATING[r.r]||RATING.C).c;
        rrPath(ctx,nx+bw+7,iy-10.5,15,13,3); ctx.fill();
        ctx.fillStyle='#fff'; ctx.font=F('700',9);
        ctx.fillText(r.r,nx+bw+11,iy-0.5);
      }
      if(r.cost>0){ ctx.textAlign='right'; ctx.fillStyle='#e5484d'; ctx.font=F('600',12); ctx.fillText(money(r.cost),rx,iy); ctx.textAlign='left'; }
    });
    y+=ch+GAP;
  });
  ctx.textAlign='center'; ctx.fillStyle='#9aa4b2'; ctx.font=F('400',11);
  ctx.fillText('行程包 · '+p.name+' · 由「行程」生成',W/2,H-22); ctx.textAlign='left';
  showShot(cv.toDataURL('image/png'),p.name);
}
function showShot(dataUrl,name){
  openSheet('<h3>长截图已生成<span class="spacer"></span><span class="tiny">'+esc(name)+'</span></h3>'
    +'<img src="'+dataUrl+'" alt="长截图" style="width:100%;border-radius:10px;border:1px solid var(--line)">'
    +'<button class="btn full" id="shotDl" style="margin-top:10px">下载图片</button>'
    +'<div class="hint">电脑端点「下载图片」保存；手机应用内长按图片选「保存图片」，或直接截屏。</div>');
  $('#shotDl').onclick=()=>{
    const a=document.createElement('a'); a.href=dataUrl; a.download=name+'-长截图.png';
    document.body.appendChild(a); a.click(); a.remove();
    if(window.Capacitor) toast('若未开始下载，请长按上方图片保存');
    else toast('已开始下载');
  };
}
$('#btnShot').onclick=shotLong;

/* ==================== 导航 ==================== */
$('#pkgBack').onclick=()=>{ S.ui.view='home'; save(); render(); };
$('#dayBack').onclick=()=>{ const rv=S.ui.returnView||'pkg'; S.ui.returnView=null; S.ui.view=rv; save(); render(); };
$('#browseBack').onclick=()=>{ S.ui.view='pkg'; S.ui.teamFilter='all'; save(); render(); };
$('#btnBrowse').onclick=()=>{ S.ui.view='browse'; S.ui.teamFilter='all'; save(); render(); };
$$('#pkgSeg button').forEach(b=>b.onclick=()=>{ S.ui.pkgTab=b.dataset.v; save(); renderPkg(); });
$('#pkgAdd').onclick=()=>{
  if(S.ui.pkgTab==='days'){
    snapState();
    const pk=PK(), dts=pk.days.map(x=>x.date).filter(Boolean).sort();
    let date='';
    if(dts.length){ const b=new Date(dts[dts.length-1]+'T00:00:00'); b.setDate(b.getDate()+1); date=dateStr(b); }
    pk.days.push({id:uid('d'),name:'第'+numCN(pk.days.length+1)+'天',date:date,arrs:[],extras:[]});
    save(); render(); toast('已新建行程卡'+(date?' · 日期 '+date:''),'撤销',doUndo);
  } else if(S.ui.pkgTab==='plans'){
    snapState();
    const pl={id:uid('p'),name:'计划'+numCN(PK().plans.length+1),items:[]};
    PK().plans.push(pl); S.ui.planId=pl.id; S.ui.view='plan';
    save(); render(); toast('已新建计划卡，从右侧地点卡栏添加','撤销',doUndo);
  } else { locEditor(null); }
};
$$('#snapSeg button').forEach(b=>b.onclick=()=>{ S.ui.snap=+b.dataset.v; save(); renderDay(); toast('拖动精度 '+b.dataset.v+' 分钟'); });

/* ==================== 渲染入口 ==================== */
function render(){
  document.body.classList.toggle('nohint',!!S.ui.hideHints);
  ['home','pkg','day','plan','browse','cost'].forEach(v=>$('#v-'+v).classList.toggle('on',S.ui.view===v));
  if(S.ui.view==='home') renderHome();
  else if(S.ui.view==='pkg') renderPkg();
  else if(S.ui.view==='day') renderDay();
  else if(S.ui.view==='plan') renderPlan();
  else if(S.ui.view==='browse') renderBrowse();
  else if(S.ui.view==='cost') renderCost();
  save();
}
render();
window.addEventListener('beforeunload',save);
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
