name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub 官方 ubuntu-latest 运行环境已预装 Android SDK，直接用即可
      # （此前的 android-actions/setup-android@v3 会失败，已移除）
      - name: Use preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "SDK 路径: $SDK"
          ls "$SDK"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Capacitor
        run: npx cap sync android

      # —— 固定签名：从仓库 Secrets 还原 keystore + key.properties ——
      # 需要的 Secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=缺少固定签名密钥::仓库 Secrets 里没有 KEYSTORE_BASE64。没有它每次构建都会生成新签名，新版无法覆盖安装旧版，请先在 Settings → Secrets and variables → Actions 里添加 4 个密钥。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/travel-release.keystore
          printf 'storeFile=travel-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreType=PKCS12\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          echo "keystore 就绪：$(stat -c %s android/app/travel-release.keystore) 字节"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK (signed)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      # 把签名证书指纹打到日志里，方便核对是不是同一把密钥（应始终相同）
      - name: Verify signature
        run: |
          APK=$(ls android/app/build/outputs/apk/release/app-release*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "APK: $APK"
          "$BT/apksigner" verify --print-certs "$APK" | sed -n '1,8p'

      - uses: actions/upload-artifact@v4
        with:
          name: travel-app-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error
